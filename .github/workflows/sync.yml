name: 同步插件

# ─────────────────────────────────────────────────────────────────────────────
#  按各分支的 _sync/plugins.txt，把插件目录更新到最新。
#
#  从哪拿代码由默认分支的 _sync/settings.ini 决定：
#    SYNC_SOURCE="kenzok8"   （默认）全部从 kenzok8/small-package 取同名目录；
#                            kenzok8 里没有的，自动回退到该插件的原始上游
#    SYNC_SOURCE="upstream"  优先按清单里的原始上游取；拿不到才用 kenzok8
#
#  怎么加插件：切到目标分支 → 编辑 _sync/plugins.txt → 加一行 → 提交
#  手动运行：Actions → 同步插件 → Run workflow
#    BRANCHES  留空 = 全部 11 个分支；也可填 "Immortalwrt,Theme1"
#    DRY_RUN   1 = 只对比不推送（先看报告）
#    ONLY_DIR  只同步某一个插件目录（调试用）
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      BRANCHES:
        description: '要同步的分支，逗号分隔；留空 = 全部 11 个'
        required: false
        default: ''
      DRY_RUN:
        description: '只对比不推送（1 = 是）'
        required: false
        default: '1'
      ONLY_DIR:
        description: '只同步这个插件目录（留空 = 全部）'
        required: false
        default: ''
  schedule:
    # 比编译早 1 小时：编译是 UTC 19:00（北京 03:00），这里 UTC 18:00（北京 02:00），日期与编译完全一致
    - cron: '0 18 1,4,5,7,9,11,14,15,17,19,21,24,25,27,29,31 * *'

env:
  TZ: Asia/Shanghai
  REPO: authon/Mine-openwrt-package
  ALL_BRANCHES: Immortalwrt,Lede,Lienol,Mt798x,Official,Theme1,Theme2,Xwrt,adguard,helloworld,passwall
  KENZOK8: kenzok8/small-package
  KENZOK8_REF: main

jobs:
  sync:
    name: 同步插件
    runs-on: ubuntu-22.04
    # 同一个仓库的同步任务排队执行：两个任务同时 clone 同一分支再各自 push，
    # 后推的会把先推的内容覆盖掉（实测踩过：nikki 被同批的 mihomo 覆盖）。
    concurrency:
      group: pkg-sync-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read

    steps:
      - name: 部署环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y git rsync curl
          sudo timedatectl set-timezone "$TZ"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git config --global advice.detachedHead false

      - name: 参数
        id: plan
        run: |
          LIST="${{ github.event.inputs.BRANCHES }}"
          [ -z "$LIST" ] && LIST="$ALL_BRANCHES"
          echo "branches=$LIST"                            >> $GITHUB_OUTPUT
          echo "dry=${{ github.event.inputs.DRY_RUN }}"    >> $GITHUB_OUTPUT
          echo "only=${{ github.event.inputs.ONLY_DIR }}"  >> $GITHUB_OUTPUT
          echo "本次分支: $LIST"

      # ── 1. 读开关 + 拉各分支清单 + 决定每条从哪拿 ─────────────────────────
      - name: 收集清单并决定来源
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
          BRANCHES: ${{ steps.plan.outputs.branches }}
          ONLY_DIR: ${{ steps.plan.outputs.only }}
        run: |
          set -uo pipefail
          if [ -z "${REPO_TOKEN:-}" ]; then
            echo "::error::没有 REPO_TOKEN 密匙（仓库 Settings → Secrets and variables → Actions）"
            exit 1
          fi
          AUTH="https://x-access-token:${REPO_TOKEN}@github.com"
          ONLY="${ONLY_DIR:-}"
          mkdir -p /tmp/up /tmp/br
          : > /tmp/raw.txt; : > /tmp/branches-used.txt

          DEF="$(curl -s -H "Authorization: Bearer ${REPO_TOKEN}" "https://api.github.com/repos/${REPO}" \
                 | sed -n 's/.*"default_branch": *"\([^"]*\)".*/\1/p' | head -1)"
          [ -z "$DEF" ] && DEF=Lede
          SETTINGS="$(curl -s "https://raw.githubusercontent.com/${REPO}/${DEF}/_sync/settings.ini")"
          SYNC_SOURCE="$(printf '%s\n' "$SETTINGS" | sed -n 's/^[[:space:]]*SYNC_SOURCE[[:space:]]*=[[:space:]]*//p' | tr -d '"' | head -1)"
          SYNC_SOURCE="${SYNC_SOURCE:-kenzok8}"
          echo "默认分支 = ${DEF} ；SYNC_SOURCE = ${SYNC_SOURCE}"

          # 1a. 拉分支 + 收集原始清单（保留原始上游，不做替换）
          #     格式：分支|目录|原始上游|原始分支|原始子目录|本地子目录|kenzok8里的目录名
          for B in ${BRANCHES//,/ }; do
            echo "::group::拉取分支 $B"
            if ! git clone -q --depth=1 --single-branch --branch "$B" "${AUTH}/${REPO}.git" "/tmp/br/$B"; then
              echo "::warning::分支 $B 拉不下来，跳过"; echo "::endgroup::"; continue
            fi
            M="/tmp/br/$B/_sync/plugins.txt"
            if [ ! -f "$M" ]; then echo "::warning::分支 $B 没有清单，跳过"; echo "::endgroup::"; continue; fi
            echo "$B" >> /tmp/branches-used.txt
            grep -v -e '^[[:space:]]*#' -e '^[[:space:]]*$' "$M" | while IFS='|' read -r dir up br sub lsub note; do
              dir="$(echo "${dir:-}" | xargs)"; up="$(echo "${up:-}" | xargs)"
              br="$(echo "${br:-}" | xargs)";   sub="$(echo "${sub:-}" | xargs)"; lsub="$(echo "${lsub:-}" | xargs)"
              [ -z "$dir" ] && continue
              [ -n "$ONLY" ] && [ "$dir" != "$ONLY" ] && continue
              [ "$up" = "@frozen" ] && continue
              [ "$up" = "@kenzok8" ] && { up=""; br=""; sub=""; }
              printf '%s|%s|%s|%s|%s|%s|%s\n' "$B" "$dir" "$up" "$br" "$sub" "$lsub" "${lsub:-$dir}" >> /tmp/raw.txt
            done
            echo "$B: $(grep -c "^$B|" /tmp/raw.txt || echo 0) 条"
            echo "::endgroup::"
          done
          [ -s /tmp/raw.txt ] || { echo "::error::没有任何可同步条目"; exit 1; }

          # 1b. 先只把 kenzok8 的目录名列表拿到（不下载内容），用来判断兜底是否可行
          echo "::group::读取 kenzok8 目录清单"
          rm -rf /tmp/kz
          git clone -q --depth=1 --single-branch --branch "$KENZOK8_REF" --filter=blob:none --sparse \
            "https://github.com/${KENZOK8}.git" /tmp/kz 2>/dev/null || true
          if [ -d /tmp/kz/.git ]; then
            git -C /tmp/kz ls-tree --name-only HEAD > /tmp/kz-dirs.txt
            echo "kenzok8 顶层目录 $(( $(wc -l < /tmp/kz-dirs.txt) )) 个"
          else
            : > /tmp/kz-dirs.txt; echo "::warning::kenzok8 拉不下来"
          fi
          echo "::endgroup::"

          # 1c. 逐条决定来源
          #     格式：分支|目录|来源(kz/up/fail)|仓库|分支|源子目录|目标子目录(lsub)
          : > /tmp/plan.txt; : > /tmp/kz-needed.txt; : > /tmp/up-needed.txt
          while IFS='|' read -r B dir up br sub lsub kz; do
            if [ "$SYNC_SOURCE" = "upstream" ] && [ -n "$up" ]; then
              printf '%s|%s|up|%s|%s|%s|%s\n' "$B" "$dir" "$up" "$br" "$sub" "$lsub" >> /tmp/plan.txt
              printf '%s\t%s\t%s\n' "$up" "$br" "$sub" >> /tmp/up-needed.txt
            elif grep -qx "$kz" /tmp/kz-dirs.txt; then
              printf '%s|%s|kz||||%s\n' "$B" "$dir" "$lsub" >> /tmp/plan.txt
              echo "$kz" >> /tmp/kz-needed.txt
            elif [ -n "$up" ]; then
              # kenzok8 没有这个目录 → 回退到它的原始上游（这是关键的回退逻辑）
              printf '%s|%s|up|%s|%s|%s|%s\n' "$B" "$dir" "$up" "$br" "$sub" "$lsub" >> /tmp/plan.txt
              printf '%s\t%s\t%s\n' "$up" "$br" "$sub" >> /tmp/up-needed.txt
            else
              printf '%s|%s|fail||||\n' "$B" "$dir" >> /tmp/plan.txt
            fi
          done < /tmp/raw.txt
          KZ_N="$(grep -c '|kz|' /tmp/plan.txt 2>/dev/null || true)"; KZ_N="${KZ_N:-0}"
          UP_N="$(grep -c '|up|' /tmp/plan.txt 2>/dev/null || true)"; UP_N="${UP_N:-0}"
          FAIL_N="$(grep -c '|fail|' /tmp/plan.txt 2>/dev/null || true)"; FAIL_N="${FAIL_N:-0}"
          echo "计划：kenzok8 ${KZ_N} 条，原始上游 ${UP_N} 条，无来源 ${FAIL_N} 条"

          # 1d. 需要的内容：kenzok8 稀疏检出 + 回退用的原始上游
          echo "::group::准备内容"
          if [ -s /tmp/kz-needed.txt ]; then
            sort -u /tmp/kz-needed.txt > /tmp/kz-set.txt
            git -C /tmp/kz sparse-checkout set $(tr '\n' ' ' < /tmp/kz-set.txt) >/dev/null 2>&1 || true
            git -C /tmp/kz checkout -q 2>/dev/null || true
            echo "kenzok8 检出 $(( $(wc -l < /tmp/kz-set.txt) )) 个目录"
          fi
          if [ -s /tmp/up-needed.txt ]; then
            sort -u /tmp/up-needed.txt | awk -F'\t' '{k=$1"@"$2; subs[k]=subs[k]" "$3; r[k]=$1; f[k]=$2} END{for(k in r) print r[k]"\t"f[k]"\t"subs[k]}' > /tmp/up-grouped.txt
            echo "需要 $(( $(wc -l < /tmp/up-grouped.txt) )) 个原始上游（kenzok8 里没有的那些）"
            clone_one() {
              local repo="$1" ref="$2" subs="$3" key
              key="$(echo "${repo}@${ref}" | tr '/@' '__')"
              [ -d "/tmp/up/$key/.git" ] && return 0
              rm -rf "/tmp/up/$key"
              [ -z "$ref" ] && ref="$(git ls-remote --symref "https://github.com/${repo}.git" HEAD 2>/dev/null | sed -n 's|^ref: refs/heads/\([^[:space:]]*\).*|\1|p' | head -1)"
              if [ -n "$subs" ] && [ "$subs" != " " ]; then
                git clone -q --depth=1 --single-branch --branch "$ref" --filter=blob:none --sparse "https://github.com/${repo}.git" "/tmp/up/$key" 2>/dev/null \
                  && git -C "/tmp/up/$key" sparse-checkout set $subs >/dev/null 2>&1
              else
                git clone -q --depth=1 --single-branch --branch "$ref" "https://github.com/${repo}.git" "/tmp/up/$key" 2>/dev/null
              fi
              if [ -d "/tmp/up/$key/.git" ]; then echo "  ✓ ${repo}@${ref}"; else echo "  ✗ ${repo}@${ref}"; rm -rf "/tmp/up/$key"; fi
            }
            export -f clone_one
            while IFS=$'\t' read -r r f s; do
              clone_one "$r" "$f" "$s" &
              while [ "$(jobs -r | wc -l)" -ge 6 ]; do sleep 0.3; done
            done < /tmp/up-grouped.txt
            wait
          fi
          echo "::endgroup::"

      # ── 2. 逐分支同步 + 推送 ─────────────────────────────────────────────
      - name: 同步并推送
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
          DRY_RUN: ${{ steps.plan.outputs.dry }}
        run: |
          set -uo pipefail
          AUTH="https://x-access-token:${REPO_TOKEN}@github.com"
          : > /tmp/report.md
          echo "| 分支 | 目录 | 来源 | 结果 |" >> /tmp/report.md
          echo "| --- | --- | --- | --- |" >> /tmp/report.md

          for B in $(cat /tmp/branches-used.txt); do
            echo "::group::同步分支 $B"
            D="/tmp/br/$B"
            cd "$D" || { echo "  ✗ 目录没了"; echo "::endgroup::"; continue; }
            grep "^$B|" /tmp/plan.txt | while IFS='|' read -r _ dir kind up br sub lsub; do
              if [ "$kind" = "fail" ]; then
                echo "  ✗ $dir : kenzok8 和原始上游都没有"
                echo "| $B | $dir | - | 失败（无来源） |" >> /tmp/report.md
                continue
              fi
              if [ "$kind" = "kz" ]; then
                SRC="/tmp/kz/${lsub:-$dir}"; SRCNAME="${KENZOK8}@${KENZOK8_REF}/${lsub:-$dir}"
              else
                key="$(echo "${up}@${br}" | tr '/@' '__')"
                SRC="/tmp/up/$key/${sub:+$sub/}"; SRC="${SRC%/}"
                SRCNAME="${up}@${br}${sub:+/$sub}"
              fi
              if [ ! -d "$SRC" ]; then
                echo "  ✗ $dir : 来源没有内容（$SRCNAME）"
                echo "| $B | $dir | $SRCNAME | 失败（来源无内容） |" >> /tmp/report.md
                continue
              fi
              DST="$D/$dir/${lsub:+$lsub/}"
              mkdir -p "$DST"
              if rsync -a --delete --exclude '.git' "$SRC/" "$DST"; then
                echo "  ✓ $dir  <-  $SRCNAME"
                echo "| $B | $dir | $SRCNAME | ok |" >> /tmp/report.md
              else
                echo "  ✗ $dir : rsync 失败"
                echo "| $B | $dir | $SRCNAME | 失败（rsync） |" >> /tmp/report.md
              fi
            done

            # 安全网：把上游引用改写回本账号
            for pair in \
              '281677160/build-actions:authon/Mine-build-actions' \
              '281677160/common:authon/Mine-common' \
              '281677160/openwrt-package:authon/Mine-openwrt-package' \
              '281677160/luci-theme-argon:authon/Mine-luci-theme-argon' \
              '281677160/luci-app-autoupdate:authon/Mine-luci-app-autoupdate' \
              '281677160/bendi:authon/Mine-bendi' \
              'danshui-git/mt798x-24.10:authon/Mine-mt798x-24.10' \
              'danshui-git/shuoming:authon/Mine-shuoming' \
              'danshui-git/debugger-action:authon/Mine-debugger-action' \
              'danshui-git/free-disk-space:authon/Mine-free-disk-space' \
              'danshui-git/delete-releases-workflows:authon/Mine-delete-releases-workflows' ; do
              old="${pair%%:*}"; new="${pair##*:}"
              files="$(git grep -l -F "$old" -- . 2>/dev/null | grep -v '^_sync/' || true)"
              if [ -n "$files" ]; then
                echo "  改写 $old -> $new （$(echo "$files" | wc -l) 个文件）"
                echo "$files" | xargs -r sed -i "s|$old|$new|g"
              fi
            done

            CHANGED="$(git status --porcelain | wc -l)"
            if [ "$CHANGED" = "0" ]; then
              echo "  没有变化"
            elif [ "${DRY_RUN}" = "1" ]; then
              echo "  [DRY RUN] $CHANGED 处改动，不推送。改动最多的目录："
              git status --porcelain | awk '{print $NF}' | cut -d/ -f1-2 | sort | uniq -c | sort -rn | head -20
            else
              git add -A
              git commit -q -m "同步插件于$(date +%Y年%m月%d号-%H点%M分)"
              if git push -q "${AUTH}/${REPO}.git" "HEAD:${B}"; then
                echo "  已推送 $(git log --oneline -1)"
              else
                echo "::error::分支 $B 推送失败"
              fi
            fi
            cd /tmp && rm -rf "$D"          # 及时释放磁盘
            echo "::endgroup::"
          done

      - name: 报告
        if: always()
        run: |
          [ -f /tmp/report.md ] && cat /tmp/report.md
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ] && [ -f /tmp/report.md ]; then
            {
              echo "## 插件同步报告"
              echo ""
              echo "- 模式：$([ "${{ github.event.inputs.DRY_RUN }}" = "1" ] && echo '只对比不推送' || echo '同步并推送')"
              echo "- 时间：$(date '+%Y-%m-%d %H:%M:%S')"
              echo ""
              cat /tmp/report.md
            } >> "$GITHUB_STEP_SUMMARY"
          fi
