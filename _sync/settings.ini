# ─────────────────────────────────────────────────────────────────────────────
#  插件同步开关（改完保存即可，下次同步生效；放在默认分支，控制所有分支）
# ─────────────────────────────────────────────────────────────────────────────
#
# SYNC_SOURCE 决定「同步时实际从哪个仓库拿代码」：
#
#   kenzok8   全部从 kenzok8/small-package 取同名目录（**默认**）
#             · 内容和你现在仓库里的一致（实测同一个 Makefile 的 git blob SHA 逐一相同，
#               kenzok8 只是搬运工、不改文件）
#             · 它每天更新 5~8 次，是最稳的选择
#
#   upstream  优先按各分支 _sync/plugins.txt 里写的**原始上游**取；
#             某个插件在 plugins.txt 里写的是 @kenzok8、或者原仓库验证不过，就用 kenzok8
#             · 好处：作者还在维护的插件能比 kenzok8 早几小时拿到
#             · 坏处：多依赖 29 个第三方仓库（其中有些已经停更，但停更的插件内容也不会变）
#
# 说明：这个开关**只影响「从哪拿」，不会改动 plugins.txt 里记录的原始上游清单**，
#       所以你可以随时来回切，不用重新生成清单。
#
# 改完怎么生效：Actions → 同步插件 → Run workflow（不想改动就先填 DRY_RUN=1 只看报告）
#
SYNC_SOURCE="kenzok8"
